<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Tap</title>
<style>
  :root {
    --bg: #fff6d6;
    --ink: #2b2350;
    --card: #ffffff;
    --red: #ff4d4d;
    --blue: #3b82f6;
    --green: #22c55e;
    --yellow: #facc15;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1e1b3a; --ink: #fff6d6; --card: #2e2a57; }
  }
  :root[data-theme="dark"] { --bg: #1e1b3a; --ink: #fff6d6; --card: #2e2a57; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; text-align: center;
  }
  h1 { margin: 0; font-size: 2rem; }
  .score { font-size: 1.4rem; font-weight: 700; background: var(--card); padding: 6px 22px; border-radius: 999px; }
  .prompt { font-size: 1.2rem; margin: 0; }
  .word { font-size: clamp(3rem, 16vw, 6rem); font-weight: 900; margin: 0; letter-spacing: 2px; min-height: 1.2em; color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: min(420px, 100%); }
  .btn {
    aspect-ratio: 1.3; border: 0; border-radius: 28px; cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,.25); font-size: 1.1rem; font-weight: 800; color: rgba(0,0,0,.0);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .btn:focus-visible { outline: 5px solid var(--ink); outline-offset: 3px; }
  .red { background: var(--red); } .blue { background: var(--blue); }
  .green { background: var(--green); } .yellow { background: var(--yellow); }
  .msg { font-size: 1.6rem; font-weight: 800; min-height: 1.6em; margin: 0; }
  .good { color: #16a34a; } .bad { color: #ea580c; }
  .reset { background: none; border: 2px solid var(--ink); color: var(--ink); border-radius: 999px; padding: 6px 18px; font: inherit; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <h1>Color Tap</h1>
  <div class="score">Score: <span id="score">0</span></div>
  <p class="prompt">Tap this color:</p>
  <p class="word" id="word">...</p>
  <div class="grid" id="grid"></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <button class="reset" id="reset">Start over</button>

<script>
  const colors = [
    { name: "RED", cls: "red", hex: "#ff4d4d" },
    { name: "BLUE", cls: "blue", hex: "#3b82f6" },
    { name: "GREEN", cls: "green", hex: "#22c55e" },
    { name: "YELLOW", cls: "yellow", hex: "#facc15" }
  ];
  const happy = ["Great job!", "Yay!", "You got it!", "Awesome!", "Super!"];
  let score = 0, target = null;
  const $ = id => document.getElementById(id);

  // build buttons
  colors.forEach(c => {
    const b = document.createElement("button");
    b.className = "btn " + c.cls;
    b.setAttribute("aria-label", c.name);
    b.onclick = () => choose(c);
    $("grid").appendChild(b);
  });

  function newRound() {
    let next;
    do { next = colors[Math.floor(Math.random() * colors.length)]; } while (next === target);
    target = next;
    $("word").textContent = target.name;
  }

  function choose(c) {
    const msg = $("msg");
    if (c === target) {
      score++;
      $("score").textContent = score;
      msg.textContent = happy[Math.floor(Math.random() * happy.length)] + " ⭐";
      msg.className = "msg good";
      newRound();
    } else {
      msg.textContent = "Try again!";
      msg.className = "msg bad";
    }
  }

  $("reset").onclick = () => { score = 0; $("score").textContent = 0; $("msg").textContent = ""; newRound(); };
  newRound();
</script>
</body>
</html>
